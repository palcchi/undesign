[package]
name = "undesign-web"
description = "Undesign in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
agent-relay = []

[lints]
workspace = true

[[bin]]
name = "undesign-web"
path = "src/main.rs"

[dependencies]
undesign-engine = { workspace = true }
undesign-ui-egui = { workspace = true }
undesign-collab-net = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
zeroize = "1.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "HtmlAnchorElement", "Node", "Blob", "BlobPropertyBag", "File", "FileList", "HtmlInputElement", "EventTarget", "Url", "Location", "MediaQueryList", "Navigator", "Gamepad", "GamepadButton", "GamepadMappingType", "Headers", "Request", "RequestInit", "RequestCredentials", "RequestRedirect", "Response"] }
